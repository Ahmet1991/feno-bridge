name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runtime_asset: codex-chatgpt-web-darwin-arm64.tar.gz
          - runner: macos-15-intel
            runtime_asset: codex-chatgpt-web-darwin-amd64.tar.gz
          - runner: ubuntu-latest
            runtime_asset: codex-chatgpt-web-linux-amd64.tar.gz
          - runner: windows-latest
            runtime_asset: codex-chatgpt-web-windows-amd64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV
      - name: Prepare compatible Linux libnotify
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev libgdk-pixbuf-2.0-dev binutils
          ./scripts/prepare-linux-libnotify.sh
      - name: Prepare owned AppImage toolset
        if: runner.os == 'Linux'
        run: bun run launcher/scripts/prepare-linux-appimage-tools.cjs
      - run: bun run verify
      - run: bun run app:package
      - name: Verify Linux AppImage ABI on current Arch
        if: runner.os == 'Linux'
        run: |
          artifact="$(find launcher/artifacts -maxdepth 1 -name '*-linux-x64.AppImage' -print -quit)"
          test -n "$artifact"
          docker run --rm -v "$PWD:/work:ro" -e APPIMAGE_PATH="/work/$artifact" archlinux:base \
            sh -lc 'pacman -Sy --noconfirm binutils file glibc alsa-lib at-spi2-core cairo cups gtk3 libx11 libxcb libxcomposite libxdamage libxext libxfixes libxkbcommon libxrandr mesa nspr nss pango >/dev/null && /work/launcher/scripts/smoke-linux-appimage-symbols.sh "$APPIMAGE_PATH"'
      - name: Ensure virtual display is available
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: bun run app:smoke
      - name: Verify embedded macOS runtime signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict launcher/build/runtime/runtime/bun
      - name: Verify packaged macOS application signature
        if: runner.os == 'macOS'
        run: |
          archive="$(find launcher/artifacts -maxdepth 1 -name '*-mac-*.zip' -print -quit)"
          test -n "$archive"
          stage="$(mktemp -d)"
          ditto -x -k "$archive" "$stage"
          codesign --verify --deep --strict --verbose=2 "$stage/Feno Bridge.app"
      - name: Archive runtime
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.runtime_asset }}" -C launcher/build/runtime .
      - name: Archive Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path launcher/build/runtime/* -DestinationPath "${{ matrix.runtime_asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}
          path: |
            ${{ matrix.runtime_asset }}
            launcher/artifacts/*.dmg
            launcher/artifacts/*.zip
            launcher/artifacts/*.exe
            launcher/artifacts/*.AppImage
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run licenses
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release tag matches package version
        run: |
          expected="v$(jq -r .version package.json)"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Add licenses and installers
        run: |
          cp LICENSE release-assets/LICENSE
          cp LICENSES/Bun-1.4.0.md release-assets/Bun-1.4.0.md
          cp LICENSES/libnotify-0.8.7-LGPL-2.1.md release-assets/libnotify-0.8.7-LGPL-2.1.md
          cp dist/THIRD_PARTY_NOTICES.txt release-assets/THIRD_PARTY_NOTICES.txt
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install-launcher.sh release-assets/install-launcher.sh
          cp scripts/install-launcher.ps1 release-assets/install-launcher.ps1
      - name: Flatten release assets
        run: |
          cd release-assets
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ -e "$name" ]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            mv "$file" "$name"
          done < <(find . -mindepth 2 -type f -print0 | sort -z)
          find . -mindepth 1 -type d -empty -delete
      - name: Add stable Windows installer link
        run: |
          version="$(jq -r .version package.json)"
          source="release-assets/feno-bridge-${version}-win-x64.exe"
          target="release-assets/feno-bridge-setup.exe"
          test -f "$source"
          test ! -e "$target"
          cp "$source" "$target"
          cmp -s "$source" "$target"
      - name: Create checksums
        run: |
          cd release-assets
          checksum_file="$(mktemp)"
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$checksum_file"
          mv "$checksum_file" checksums.txt
      - name: Verify every built asset is checksummed
        run: |
          cd release-assets
          missing=""
          while IFS= read -r -d '' file; do
            name="${file#./}"
            if [ "$name" = checksums.txt ]; then continue; fi
            if ! awk -v asset="$name" '$2 == asset { found = 1 } END { exit found ? 0 : 1 }' checksums.txt; then
              missing="$missing $name"
            fi
          done < <(find . -type f -print0)
          if [ -n "$missing" ]; then
            echo "checksums.txt is missing entries for:$missing" >&2
            exit 1
          fi
      - name: Stage and verify draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' release_files < <(find release-assets -type f -print0)
          test "${#release_files[@]}" -gt 0
          prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=true
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft, .isPrerelease] | @tsv')"
            IFS=$'\t' read -r is_draft is_prerelease <<< "$existing"
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to modify already-public release $GITHUB_REF_NAME" >&2
              exit 1
            fi
            if [ "$is_prerelease" != "$prerelease" ]; then
              echo "Existing draft prerelease state does not match tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
          else
            create_flags=(--draft)
            if [ "$prerelease" = "true" ]; then create_flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              "${create_flags[@]}" \
              --generate-notes
          fi

          for file in "${release_files[@]}"; do
            name="$(basename "$file")"
            local_digest="sha256:$(sha256sum "$file" | awk '{ print $1 }')"
            remote_digest="$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq ".assets[] | select(.name == \"$name\") | .digest")"
            if [ -n "$remote_digest" ]; then
              if [ "$remote_digest" != "$local_digest" ]; then
                echo "Draft asset differs from local build output: $name" >&2
                exit 1
              fi
              continue
            fi
            gh release upload "$GITHUB_REF_NAME" "$file" --repo "$GITHUB_REPOSITORY"
          done

          expected_names="$(mktemp)"
          remote_names="$(mktemp)"
          printf '%s\n' "${release_files[@]##*/}" | LC_ALL=C sort > "$expected_names"
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' \
            | LC_ALL=C sort > "$remote_names"
          if ! cmp -s "$expected_names" "$remote_names"; then
            echo "Draft release asset inventory does not match the build output" >&2
            diff -u "$expected_names" "$remote_names" >&2 || true
            exit 1
          fi

          while IFS= read -r file; do
            name="$(basename "$file")"
            remote_digest="$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq ".assets[] | select(.name == \"$name\") | .digest")"
            local_digest="sha256:$(sha256sum "$file" | awk '{ print $1 }')"
            if [ "$remote_digest" != "$local_digest" ]; then
              echo "Draft release asset checksum mismatch: $name" >&2
              exit 1
            fi
          done < <(find release-assets -type f | LC_ALL=C sort)

          while read -r expected name; do
            test -n "$expected"
            test -n "$name"
            actual="$(sha256sum "release-assets/$name" | awk '{ print $1 }')"
            if [ "$actual" != "$expected" ]; then
              echo "Local release manifest mismatch: $name" >&2
              exit 1
            fi
          done < release-assets/checksums.txt

      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            "${release_flags[@]}"
